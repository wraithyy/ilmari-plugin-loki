# Loki + Grafana with the ilmari data source and dashboards pre-provisioned.
#   docker compose up -d   ->  Grafana on http://localhost:3000, Loki on :3100
# Point the plugin's url at http://localhost:3100.
services:
  loki:
    image: grafana/loki:3.5.0
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes: [loki-data:/loki]
  grafana:
    image: grafana/grafana:12.0.0
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ilmari-overview.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [loki]
volumes:
  loki-data:
