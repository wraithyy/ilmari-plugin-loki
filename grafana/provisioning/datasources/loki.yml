apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 5000
      # The task id becomes a link to the Task explorer in every log line's details.
      derivedFields:
        - name: task
          matcherType: label
          matcherRegex: task
          url: /d/ilmari-task/ilmari-task-explorer?var-task=${__value.raw}&${__url_time_range}
          urlDisplayLabel: Open in Task explorer
